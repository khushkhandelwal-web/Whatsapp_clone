name: khush_chat
description: A WhatsApp-style chat app built with Flutter, Firebase, and flutter_bloc.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.1.0

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Media / files
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  path: ^1.9.0

  # WebRTC
  flutter_webrtc: ^0.11.7

  # Misc
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.6
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true